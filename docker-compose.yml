services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: franchisedb
      MYSQL_USER: franchise_user
      MYSQL_PASSWORD: franchise_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/franchisedb
      SPRING_R2DBC_USERNAME: franchise_user
      SPRING_R2DBC_PASSWORD: franchise_pass
    ports:
      - "8080:8080"

volumes:
  mysql_data: